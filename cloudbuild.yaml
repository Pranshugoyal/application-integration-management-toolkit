# gcloud builds submit --config=cloudbuild.yaml --project=project-name --substitutions=TAG="v0.65"
steps:

# Capture the digest currently behind :latest (the outgoing release) BEFORE this
# build moves :latest, so the superseded release can be lifecycle-tagged at the end.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: capture_previous_latest
  entrypoint: 'bash'
  args:
    - -c
    - |
      PREV_DIGEST=$$(gcloud artifacts docker images describe ${_IMAGE_NAME}:latest \
        --format='value(image_summary.digest)' 2>/dev/null || true)
      echo "$${PREV_DIGEST}" > /workspace/prev_latest_digest.txt
      echo "Previous :latest digest: $${PREV_DIGEST:-<none>}"

#publish integrationcli
- name: 'gcr.io/cloud-builders/docker'
  id: build_integrationcli
  args:
    - 'build'
    - '-t'
    - '${_IMAGE_NAME}:${TAG_NAME}'
    - '-f'
    - 'Dockerfile'
    - '.'
    - '--build-arg'
    - 'TAG=${TAG_NAME}'
    - '--build-arg'
    - 'COMMIT=$COMMIT_SHA'
- name: 'gcr.io/cloud-builders/docker'
  id: push_integrationcli
  args: ['push', '${_IMAGE_NAME}:${TAG_NAME}']
- name: 'gcr.io/cloud-builders/docker'
  id: tag_latest_integrationcli
  args: ['tag', '${_IMAGE_NAME}:${TAG_NAME}', '${_IMAGE_NAME}:latest']
- name: 'gcr.io/cloud-builders/docker'
  id: push_latest_integrationcli
  args: ['push', '${_IMAGE_NAME}:latest']

#sign and attach integrationcli
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: get_token
  entrypoint: 'bash'
  args:
    - -c
    - |
      gcloud auth print-access-token > /workspace/token.txt
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: sign_integrationcli
  entrypoint: 'bash'
  secretEnv: ['COSIGN_PASSWORD', 'COSIGN_PRIVATE_KEY']
  env: ['HOME=/tmp']
  args:
    - -c
    - |
      # Download cosign
      curl -sL https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64 -o /tmp/cosign
      
      # Verify hash
      echo "c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74  /tmp/cosign" | sha256sum -c -
      
      chmod +x /tmp/cosign
      
      # Login and sign
      gcloud auth print-access-token > /tmp/token.txt
      /tmp/cosign login us-docker.pkg.dev -u oauth2accesstoken -p $(cat /tmp/token.txt)
      echo "$$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
      /tmp/cosign sign --key=/tmp/cosign.key --yes ${_IMAGE_NAME}:${TAG_NAME}

- name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
  id: export_sbom
  entrypoint: gcloud
  args:
    - artifacts
    - sbom
    - export
    - --uri=${_IMAGE_NAME}:${TAG_NAME}
    - --project=${PROJECT_ID}

# Apply an image-lifecycle tag to the PREVIOUS release so the public image
# scanner (go/publico) treats the superseded digest as retired and stops filing
# vulnerability bugs against it. See go/public-image-lifecycle-management.
# Note: this retires *old* releases automatically; it does NOT patch the current
# release. Keeping the golang builder base current (Dockerfile `FROM golang:1.26`)
# via regular rebuilds is what keeps :latest itself free of new stdlib CVEs.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: deprecate_previous_release
  entrypoint: 'bash'
  args:
    - -c
    - |
      PREV_DIGEST=$$(cat /workspace/prev_latest_digest.txt 2>/dev/null || true)
      NEW_DIGEST=$$(gcloud artifacts docker images describe ${_IMAGE_NAME}:${TAG_NAME} \
        --format='value(image_summary.digest)' 2>/dev/null || true)
      if [ -z "$${PREV_DIGEST}" ]; then
        echo "No previous :latest digest found; nothing to deprecate (first release?)."
        exit 0
      fi
      if [ "$${PREV_DIGEST}" = "$${NEW_DIGEST}" ]; then
        echo "Previous :latest already points at this release ($${NEW_DIGEST}); skipping."
        exit 0
      fi
      SHA="$${PREV_DIGEST#sha256:}"
      echo "Marking previous release $${PREV_DIGEST} as ${_LIFECYCLE_TAG_PREFIX}$${SHA}"
      gcloud artifacts docker tags add \
        "${_IMAGE_NAME}@$${PREV_DIGEST}" \
        "${_IMAGE_NAME}:${_LIFECYCLE_TAG_PREFIX}$${SHA}" \
        --quiet

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/integrationcli-cosign-password/versions/latest
    env: 'COSIGN_PASSWORD'
  - versionName: projects/$PROJECT_ID/secrets/integrationcli-cosign-private-key/versions/latest
    env: 'COSIGN_PRIVATE_KEY'

images:
- '${_IMAGE_NAME}:${TAG_NAME}'

#repo name
substitutions:
  _REPO: "images"
  _IMAGE_NAME: "us-docker.pkg.dev/${PROJECT_ID}/${_REPO}/integrationcli"
  _COSIGN_IMAGE_NAME: "us-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cosign"
  # Lifecycle-tag prefix applied to the superseded release on each new release
  # (go/public-image-lifecycle-management). Switch to "no-new-use-public-image-"
  # if older releases remain supported for customers pinned to them.
  _LIFECYCLE_TAG_PREFIX: "deprecated-public-image-"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  dynamic_substitutions: true
  requestedVerifyOption: VERIFIED
